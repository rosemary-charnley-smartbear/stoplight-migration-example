openapi: 3.0.3
x-stoplight:
  id: 97b927efabdeb
info:
  title: Store API
  version: '1.0'
  description: |-
    Reference example of an OpenAPI 3.0 description structured the Stoplight way: a thin spec in `reference/` that pulls schemas from standalone JSON Schema files in `models/` and shared components from another spec (`Common.v1.yaml`) using `$ref`.

    Three kinds of `$ref` appear below, each labelled inline:
    1. **Internal** — `#/components/...` points inside this same file.
    2. **External JSON Schema model** — `../models/Product.yaml` points at a
       standalone schema file.

    3. **Cross-specification** — `./Common.v1.yaml#/components/...` points into a
       different OpenAPI document.
  contact:
    name: Store API Team
    email: api@example.com
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
servers:
  - url: 'https://api.example.com/v1'
    description: Production
  - url: 'https://sandbox.api.example.com/v1'
    description: Sandbox
tags:
  - name: Products
  - name: Orders
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      tags:
        - Products
      parameters:
        # Cross-specification $ref: parameters defined in the shared Common spec.
        - $ref: ./Common.v1.yaml#/components/parameters/PageLimit
        - $ref: ./Common.v1.yaml#/components/parameters/PageCursor
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - active
              - archived
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      # External JSON Schema model file.
                      $ref: ../models/Product.yaml
                  nextCursor:
                    type: string
                    nullable: true
                required:
                  - data
        4XX:
          # Cross-specification $ref to a reusable response.
          $ref: ./Common.v1.yaml#/components/responses/Problem
    post:
      operationId: createProduct
      summary: Create a product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/Product.yaml
      responses:
        '201':
          description: The created product.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: ../models/Product.yaml
        '422':
          $ref: ./Common.v1.yaml#/components/responses/Problem
  '/products/{productId}':
    parameters:
      # Internal $ref to a parameter defined in this file's components block.
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get a product by id
      tags:
        - Products
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: ../models/Product.yaml
        '404':
          $ref: ./Common.v1.yaml#/components/responses/NotFound
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/Order.yaml
      responses:
        '201':
          description: The created order.
          content:
            application/json:
              schema:
                $ref: ../models/Order.yaml
        '400':
          $ref: ./Common.v1.yaml#/components/responses/Problem
  '/orders/{orderId}':
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOrder
      summary: Get an order by id
      tags:
        - Orders
      responses:
        '200':
          description: 'The requested order, with the customer inlined.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../models/Order.yaml
                  - type: object
                    properties:
                      customer:
                        # references can chain across files.
                        # External model that itself $refs into Common.v1.yaml —
                        $ref: ../models/Customer.yaml
        '404':
          $ref: ./Common.v1.yaml#/components/responses/NotFound
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: Unique identifier of the product.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
