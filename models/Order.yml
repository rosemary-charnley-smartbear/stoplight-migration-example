title: Order
x-stoplight:
  id: order-model-0001
type: object
description: A customer order composed of one or more line items.
example:
  id: o9f8e7d6-c5b4-4a32-9110-fedcba987654
  customerId: c1a2b3c4-d5e6-7f80-9a1b-2c3d4e5f6071
  status: pending
  items:
    - productId: 8f3b6d1e-2c4a-4f9b-9a1e-7c2d5e6f8a90
      quantity: 2
      unitPrice:
        amount: 12900
        currency: USD
  total:
    amount: 25800
    currency: USD
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  customerId:
    type: string
    format: uuid
  status:
    type: string
    enum:
      - pending
      - paid
      - shipped
      - cancelled
    default: pending
  items:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          # Reuse the shared Money model via JSON Schema $ref.
          $ref: ./Money.yml
      required:
        - productId
        - quantity
      additionalProperties: false
  total:
    $ref: ./Money.yml
required:
  - customerId
  - items
additionalProperties: false