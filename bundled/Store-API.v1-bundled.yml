openapi: 3.0.3
info:
  version: '1.0'
  title: Store API
  description: Store API with references
  contact:
    name: Store API Team
    email: api@example.com
  license:
    url: 'https://opensource.org/licenses/MIT'
    name: MIT
servers:
  - url: 'https://api.example.com/v1'
    description: Production
  - url: 'https://sandbox.api.example.com/v1'
    description: Sandbox
paths:
  /products:
    get:
      tags:
        - Products
      summary: List products
      operationId: listProducts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - active
              - archived
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                  - data
        4XX:
          $ref: '#/components/responses/Problem'
      security:
        - bearerAuth: []
      servers:
        - url: 'https://api.example.com/v1'
          description: Production
        - url: 'https://sandbox.api.example.com/v1'
          description: Sandbox
    post:
      tags:
        - Products
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: The created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              schema:
                type: string
                format: uri
        '422':
          $ref: '#/components/responses/Problem'
      security:
        - bearerAuth: []
      servers:
        - url: 'https://api.example.com/v1'
          description: Production
        - url: 'https://sandbox.api.example.com/v1'
          description: Sandbox
  '/products/{productId}':
    get:
      tags:
        - Products
      summary: Get a product by id
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
      servers:
        - url: 'https://api.example.com/v1'
          description: Production
        - url: 'https://sandbox.api.example.com/v1'
          description: Sandbox
  /orders:
    post:
      tags:
        - Orders
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: The created order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
      security:
        - bearerAuth: []
      servers:
        - url: 'https://api.example.com/v1'
          description: Production
        - url: 'https://sandbox.api.example.com/v1'
          description: Sandbox
  '/orders/{orderId}':
    get:
      tags:
        - Orders
      summary: Get an order by id
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'The requested order, with the customer inlined.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      customer:
                        $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
      servers:
        - url: 'https://api.example.com/v1'
          description: Production
        - url: 'https://sandbox.api.example.com/v1'
          description: Sandbox
tags:
  - name: Products
  - name: Orders
components:
  parameters:
    ProductId:
      name: productId
      in: path
      description: Unique identifier of the product.
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageCursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response.
      required: false
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: An error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                title: Not Found
                status: 404
                detail: No resource matches the given id.
  schemas:
    Product:
      type: object
      title: Product
      description: A single sellable product in the store catalog.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Server-generated unique identifier.
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          description: Lifecycle state of the product.
          default: draft
        price:
          $ref: '#/components/schemas/Money'
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
      required:
        - name
        - price
      example:
        id: 8f3b6d1e-2c4a-4f9b-9a1e-7c2d5e6f8a90
        name: Trail Runner Backpack
        status: active
        price:
          amount: 12900
          currency: USD
        tags:
          - outdoor
          - bags
    Money:
      type: object
      title: Money
      description: A monetary amount as a minor-unit integer plus an ISO 4217 currency code. Reused across models via a JSON Schema `$ref`.
      additionalProperties: false
      properties:
        amount:
          type: integer
          description: Value in the smallest currency unit (e.g. cents).
          format: int64
          minimum: 0
          example: 1999
        currency:
          type: string
          description: ISO 4217 three-letter currency code.
          pattern: '^[A-Z]{3}$'
          example: USD
      required:
        - amount
        - currency
      example:
        amount: 1999
        currency: USD
    Order:
      type: object
      title: Order
      description: A customer order composed of one or more line items.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customerId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - cancelled
          default: pending
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
              unitPrice:
                $ref: '#/components/schemas/Money'
            required:
              - productId
              - quantity
        total:
          $ref: '#/components/schemas/Money'
      required:
        - customerId
        - items
      example:
        id: o9f8e7d6-c5b4-4a32-9110-fedcba987654
        customerId: c1a2b3c4-d5e6-7f80-9a1b-2c3d4e5f6071
        status: pending
        items:
          - productId: 8f3b6d1e-2c4a-4f9b-9a1e-7c2d5e6f8a90
            quantity: 2
            unitPrice:
              amount: 12900
              currency: USD
        total:
          amount: 25800
          currency: USD
    Customer:
      type: object
      title: Customer
      description: A customer who can place orders.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 160
        defaultShippingAddress:
          $ref: '#/components/schemas/Address'
      required:
        - email
      example:
        id: c1a2b3c4-d5e6-7f80-9a1b-2c3d4e5f6071
        email: dana@example.com
        displayName: Dana Ives
    Address:
      type: object
      title: Address
      description: 'A postal address, shared across customer and shipping models.'
      additionalProperties: false
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        region:
          type: string
          description: 'State, province, or region.'
        postalCode:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'
      required:
        - line1
        - city
        - countryCode
    Error:
      type: object
      title: Error
      description: RFC 7807-style problem detail used by every error response.
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
      required:
        - title
        - status
security:
  - bearerAuth: []
